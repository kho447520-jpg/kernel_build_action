name: Build EurekaV3 Kernel
on: workflow_dispatch

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@v1.10.4
        with:
          kernel-url: https://github.com/kho447520-jpg/android_kernel_samsung_exynos7885
          kernel-branch: EurekaV3
          kernel-dir: 
          config: a10.config
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          ksu: true
          ksu-version: v3.4.2
          anykernel3: true