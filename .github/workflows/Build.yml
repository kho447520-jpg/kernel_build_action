name: Build EurekaV3 Kernel
on: workflow_dispatch

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@v1.10.4
        with:
          kernel-url: https://github.com/kho447520-jpg/android_kernel_samsung_exynos7885
          kernel-branch: EurekaV3
          config: exynos7885-a10_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          ksu: true
          ksu-version: v3.4.2  # KernelSU Next v3.4.2, lý thuyết hỗ trợ 4.4
          anykernel3: true